name: Build Release APK

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - uses: gradle/actions/setup-gradle@v3

    - run: ./gradlew assembleGenericRelease

    # Sign with the SDK's own apksigner so the key never reaches a third-party action
    - name: Sign app APK
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        ALIAS: ${{ secrets.ALIAS }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
        APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        for apk in app/build/outputs/apk/*/release/*-release-unsigned.apk app/build/outputs/apk/*/release/*-release.apk; do
          [ -f "$apk" ] || continue
          out="${apk%-unsigned.apk}"; out="${out%.apk}-signed.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$apk"
        done
        rm -f "$RUNNER_TEMP/release.jks"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: signed-apks
        path: app/build/outputs/apk/*/release/*-arm64-v8a-release-signed.apk
        if-no-files-found: error
        retention-days: 20
